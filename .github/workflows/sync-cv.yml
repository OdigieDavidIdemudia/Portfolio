name: Sync projects and rebuild CV

# Runs whenever you push to main, and on a daily schedule so a repo you
# publish directly on GitHub is picked up even if you forget to commit here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install python-docx

      - name: Sync GitHub projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run cv:sync

      - name: Rebuild ATS-safe CV
        run: python scripts/build_cv.py --check --docx-only

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv.json src/data/generated-projects.json public/assets
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(cv): sync GitHub projects and rebuild CV"
            git push
          fi

      - name: Upload CV artefacts
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: public/assets/David_Odigie_CV.*
          if-no-files-found: warn
